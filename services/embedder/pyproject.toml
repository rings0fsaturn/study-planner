[project]
name = "embedder"
version = "0.1.0"
description = "Sentence-transformers embedding sidecar with ROCm GPU support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentence-transformers>=5.0",
    "torch>=2.5",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
