services:
  embedder:
    build:
      context: ../..
      dockerfile: services/embedder/Dockerfile
      args:
        ROCM_IMAGE: ${ROCM_IMAGE:-rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.12.0}
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-128} # sweep winner 128 + HTTP 16 = 4,381 warm chunks/min (2026-08-17)
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      # HF_TOKEN is sourced from the repo's gitignored .env.git.local at launch
      # time (exported by the operator or the launcher script); huggingface_hub
      # picks it up automatically for model downloads and rate limits.
      HF_TOKEN: ${HF_TOKEN:-}
      # Mirror the working host venv: DLXG loader resolves librocdxg.so (unversioned
      # symlink) from /opt/rocm/lib. Without it HSA falls back to KFD and dies.
      LD_LIBRARY_PATH: /opt/rocm/lib
      # Bound the OpenMP intra-op pool so tokenization cannot grab all cores.
      # Note: these do NOT stop the WSL2 idle spin below; that is a ROCr/DXG
      # runtime limitation, not an OpenMP one.
      OMP_WAIT_POLICY: PASSIVE
      OMP_NUM_THREADS: 4
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    # NOTE: /dev/dri does not exist on this WSL2 host (verified at build time);
    # DXG is the paravirtualized GPU device here. Hosts that expose /dev/dri
    # (e.g. native Linux or other WSL setups) should add it back.
    devices:
      - /dev/dxg
    group_add:
      - video
    ipc: host
    shm_size: "8g"
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so
      - /opt/rocm/lib:/opt/rocm/lib:ro
    ports:
      - "${EMBEDDER_PORT:-8200}:8000"
    # Upstream ROCm bug (ROCm/librocdxg#60): on WSL2 DXG there are no GPU
    # interrupts, so ROCr's AsyncEventsLoop falls into a no-sleep polling loop
    # and burns two full CPU cores (~200%) for the whole lifetime of the GPU
    # context, even when completely idle. The upstream fix (ROCm/rocm-systems
    # #7898, merged 2026-08-18) is NOT in this build: ROCm 7.14.0 predates it
    # and 7.14.1 still lacks it (checked 2026-10-01, issue #12674). Containment
    # only: the cpus cap plus the nice -n 19 in the Dockerfile CMD (spinners
    # yield; GPU-bound inference is unaffected). True fix: re-pin ROCM_IMAGE
    # to a release carrying the fix - verify with
    # `strings libhsa-runtime64.so.1 | grep PollNap` (present = fixed).
    deploy:
      resources:
        limits:
          cpus: "4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start downloads both model weight sets (~1.2 GB each) into the
      # image layer, so give the healthcheck room before it starts probing.
      start_period: 120s
    restart: unless-stopped
