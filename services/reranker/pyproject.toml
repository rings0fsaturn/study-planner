[project]
name = "reranker"
version = "0.1.0"
description = "Cross-encoder reranker sidecar for retrieval quality"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentence-transformers>=5.0",
    "torch>=2.5",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
