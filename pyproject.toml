[project]
name = "study-planner-web"
version = "0.1.0"
description = "Study Tracker — Python intelligence workspace (Pillar A)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/py-progress",
    "packages/py-roadmap-engine",
    "services/intelligence",
    "research/comparison",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/py-progress/tests",
    "packages/py-roadmap-engine/tests",
    "services/intelligence/tests",
    "research/comparison/tests",
]
pythonpath = [
    "packages/py-progress/src",
    "packages/py-roadmap-engine/src",
    "services/intelligence",
    "research/comparison/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/py-progress/src",
    "packages/py-roadmap-engine/src",
    "services/intelligence",
    "research/comparison/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
