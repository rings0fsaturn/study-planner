<!-- Shared LEFT column for all onboarding-3 option mocks. Identical to baseline form.
     (Kept as a reference snippet; the option files inline a copy so they open standalone.) -->
<div class="onboarding-materials-form">
  <h1 class="onboarding-h1">What are you <em>studying</em>?</h1>
  <p class="onboarding-lead">Paste links, or add things by hand.</p>
  <div class="field-group">
    <label class="field-label">Paste a URL</label>
    <input class="field" type="url" placeholder="youtube.com/… or any article link" />
    <div class="field-helper">We'll fetch the title and length for you.</div>
  </div>
  <button class="btn btn-secondary btn-sm onboarding-add-manually-btn">+ Add manually</button>
  <div class="mono-caps onboarding-materials-count">3 added · ~2h 10m</div>
  <div class="material-list"><!-- material rows --></div>
</div>
