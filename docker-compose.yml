services:
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_INTELLIGENCE_URL: ${VITE_INTELLIGENCE_URL:-/api}
        VITE_INITIAL_RESTORE_TIMEOUT_MS: ${VITE_INITIAL_RESTORE_TIMEOUT_MS:-8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.19}
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:8200}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RETRIEVAL_ENABLED: ${RETRIEVAL_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 5

  ingestion-worker:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.19}
    command: ["python", "-m", "app.worker_main"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:8200}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
      INGESTION_VISIBILITY_SECONDS: ${INGESTION_VISIBILITY_SECONDS:-30}
      INGESTION_POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS:-1}
      INGESTION_MAX_DELIVERIES: ${INGESTION_MAX_DELIVERIES:-3}
      INGESTION_MAX_IN_FLIGHT: ${INGESTION_MAX_IN_FLIGHT:-1}
      INGESTION_MAX_BATCH_TOKENS: ${INGESTION_MAX_BATCH_TOKENS:-4000}
      INGESTION_MAX_TOKENS_PER_MINUTE: ${INGESTION_MAX_TOKENS_PER_MINUTE:-25000}
      INGESTION_LOG_LEVEL: ${INGESTION_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if os.getenv('SUPABASE_URL') else 1)\" || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s
    restart: unless-stopped
