services:
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_INTELLIGENCE_URL: ${VITE_INTELLIGENCE_URL:-/api}
        VITE_INITIAL_RESTORE_TIMEOUT_MS: ${VITE_INITIAL_RESTORE_TIMEOUT_MS:-8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.19}
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:8200}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RETRIEVAL_ENABLED: ${RETRIEVAL_ENABLED:-true}
      GENERATION_MODEL: ${GENERATION_MODEL:-deepseek/deepseek-v4-flash-0731}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-https://openrouter.ai/api/v1}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-30000}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-4096}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.3}
      GENERATION_REASONING_EFFORT: ${GENERATION_REASONING_EFFORT:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 5

  ingestion-worker:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.19}
    command: ["python", "-m", "app.worker_main"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:8200}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
      INGESTION_VISIBILITY_SECONDS: ${INGESTION_VISIBILITY_SECONDS:-30}
      INGESTION_POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS:-1}
      INGESTION_MAX_DELIVERIES: ${INGESTION_MAX_DELIVERIES:-3}
      INGESTION_MAX_IN_FLIGHT: ${INGESTION_MAX_IN_FLIGHT:-1}
      INGESTION_MAX_BATCH_TOKENS: ${INGESTION_MAX_BATCH_TOKENS:-4000}
      INGESTION_MAX_TOKENS_PER_MINUTE: ${INGESTION_MAX_TOKENS_PER_MINUTE:-25000}
      INGESTION_LOG_LEVEL: ${INGESTION_LOG_LEVEL:-INFO}
      GENERATION_MODEL: ${GENERATION_MODEL:-deepseek/deepseek-v4-flash-0731}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-https://openrouter.ai/api/v1}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-30000}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-4096}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.3}
      GENERATION_REASONING_EFFORT: ${GENERATION_REASONING_EFFORT:-off}
      # Coding grading reaches the sandbox via service DNS when the `sandbox`
      # profile is running; a stopped sandbox makes coding grades retryable.
      PISTON_URL: ${PISTON_URL:-http://piston:2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if os.getenv('SUPABASE_URL') else 1)\" || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Code-execution sandbox (#42, D-02 → Piston fallback, recorded 2026-09-16).
  # Demand-started profile: plain `docker-app start` skips it; bring it up with
  # `docker compose --profile sandbox up -d` (or COMPOSE_PROFILES=sandbox
  # ./docker-app start) and stop it when no grading work is pending (rule 54
  # pattern). Loopback publish keeps the execution API off the LAN; the
  # containerized worker reaches it via the service DNS name instead
  # (PISTON_URL on ingestion-worker).
  #
  # Judge0 CE was rejected at the P2 isolate gate: its bundled isolate 1.8.1
  # is cgroup-v1-only and this Docker Desktop/WSL2 host is cgroup-v2-only
  # (status 13 Internal Error on every submission). Piston (MIT, cgroup v2)
  # is the plan's recorded fallback; the grading arm talks verdicts, so the
  # swap is confined to the client module.
  #
  # The Python runtime is installed on first use (persists in the
  # piston-packages volume):
  #   curl -X POST http://127.0.0.1:2000/api/v2/packages \
  #     -H 'Content-Type: application/json' -d '{"language":"python","version":"3.12.0"}'
  piston:
    image: ghcr.io/engineer-man/piston
    profiles: ["sandbox"]
    privileged: true
    environment:
      PORT: 2000
      # Server-side ceilings the per-request limits must stay under; the
      # client clamps learner requests to its own (lower) pins first.
      PISTON_RUN_TIMEOUT: 20000
      PISTON_RUN_CPU_TIME: 20000
      PISTON_RUN_MEMORY_LIMIT: 268435456
    ports:
      - "127.0.0.1:2000:2000"
    # Operator-local egress workaround: this host's network filters some GitHub
    # CDN IPs (rule 52 pattern); node keeps resolving the package index to
    # 185.199.109.133 (refused). Pin a working CDN IP for the install-time
    # download only. Re-check with: curl -sI https://release-assets.githubusercontent.com/
    extra_hosts:
      - "release-assets.githubusercontent.com:185.199.108.133"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  piston-packages:
