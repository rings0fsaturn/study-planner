[project]
name = "py-progress"
version = "0.1.0"
description = "Pillar A progress engines — Bayesian calibration, CUSUM, GP projection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_progress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
